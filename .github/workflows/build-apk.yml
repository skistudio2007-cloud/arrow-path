name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Web Assets
        run: pnpm run build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android --verbose

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./ArrowGo.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArrowGo-APK
          path: ./ArrowGo.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest-apk
          name: "Arrow Go - Android APK"
          body: |
            ### 🎮 Arrow Go - Latest Android Build
            
            Click below to download `ArrowGo.apk` directly to your phone:
            - **Download**: [ArrowGo.apk](https://github.com/${{ github.repository }}/releases/download/latest-apk/ArrowGo.apk)
            
            **Installation instructions:**
            1. Tap on `ArrowGo.apk` to download.
            2. Open the downloaded file on your phone.
            3. If prompted with "Install unknown apps", tap **Settings** and turn on **Allow from this source**.
            4. Tap **Install** and enjoy playing!
          files: ./ArrowGo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
